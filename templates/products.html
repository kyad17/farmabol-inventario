{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Gestión de productos</h2>
    <a class="btn btn-success" href="{{ url_for('new_product') }}">Nuevo producto</a>
</div>
<table class="table table-striped table-hover bg-white shadow-sm">
    <thead>
        <tr>
            <th>Código</th><th>Nombre</th><th>Precio</th><th>Stock</th><th>Laboratorio</th>
        </tr>
    </thead>
    <tbody>
        {% for product in products %}
        <tr>
            <td>{{ product.code }}</td>
            <td>{{ product.name }}</td>
            <td>Bs {{ '%.2f'|format(product.price) }}</td>
            <td>{{ product.stock }}</td>
            <td>{{ product.laboratory }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
