{% extends 'base.html' %}
{% block content %}
<h2>Nuevo producto</h2>
<form method="post" class="card card-body shadow">
    <label class="form-label">Código</label>
    <input class="form-control mb-2" name="code" required>
    <label class="form-label">Nombre</label>
    <input class="form-control mb-2" name="name" required>
    <label class="form-label">Precio</label>
    <input class="form-control mb-2" type="number" step="0.01" name="price" required>
    <label class="form-label">Stock</label>
    <input class="form-control mb-2" type="number" name="stock" required>
    <label class="form-label">Laboratorio</label>
    <input class="form-control mb-3" name="laboratory" required>
    <button class="btn btn-success">Guardar</button>
</form>
{% endblock %}
